<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .custom-navbar {
            background-color: #f7a221;
            padding: 12px 24px;
        }
        .btn-left {
            background-color: #343a40;
            color: #ffffff;
            font-weight: 500;
            border-radius: 4px;
            padding: 6px 14px;
            text-decoration: none;
        }
        .btn-left:hover {
            background-color: #212529;
            color: #ffffff;
        }
        .btn-right {
            background-color: #e04f32;
            color: #ffffff;
            font-weight: 500;
            border-radius: 4px;
            padding: 6px 14px;
            text-decoration: none;
        }
        .btn-right:hover {
            background-color: #c83d22;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <div class="custom-navbar d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/categories}" class="btn-left">Quản Lý Danh Mục</a>
                <a th:href="@{/products}" class="btn-left">Quản Lý Sản Phẩm</a>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/categories/add}" class="btn-right">Thêm Danh Mục</a>
                <a th:href="@{/products/add}" class="btn-right">Thêm Sản Phẩm</a>
            </div>
        </div>
    </header>

    <div layout:fragment="content">
        <!-- Content will be placed here -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
